name: myvault
description: "MyVault — Personal digital vault Android application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  cryptography: ^2.9.0
  sqflite_sqlcipher: ^3.4.1
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

